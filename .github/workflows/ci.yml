name: CI

on:
    push:
       branches: [main]
    pull_request:
permissions:
   contents: read

jobs:
   lint: 
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
       - uses: actions/setup-python@v6
         with:
           python-version: "3.12"
       - run: pip install ruff pytest
       - run: ruff check .
       - run: pytest

   secrets:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
         with:
           fetch-depth: 0
       - run: sudo apt-get update
       - run: sudo apt-get install -y gitleaks
       - run: gitleaks detect --source . --verbose --redact

   sast:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
       - uses: actions/setup-python@v6
         with:
           python-version: "3.12"
       - run: pip install -r requirements-dev.txt
       - run: bandit -r . -ll

   sca:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
       - uses: actions/setup-python@v6
         with:
           python-version: "3.12"
       - run: pip install -r requirements-dev.txt
       - run: pip-audit -r requirements-dev.txt --no-deps --disable-pip


   semgrep:
     runs-on: ubuntu-latest
     container:
       image: semgrep/semgrep:1.181.0
     steps:
       - uses: actions/checkout@v5
       - run: semgrep scan --config p/python --error --metrics=off

