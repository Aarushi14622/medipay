name: CI

on:
    push:
       branches: [main]
    pull_request:
permissions:
   contents: read

# Supply chain rule (Day 2): every third-party action is pinned to a full
# commit SHA, and every container image to a digest. The comment after each
# SHA says which release it is, so Dependabot and humans can read it.

jobs:
   lint:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
         with:
           python-version: "3.12"
       - run: pip install --require-hashes -r requirements-dev.txt
       - run: ruff check .
       - run: pytest

   secrets:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         with:
           fetch-depth: 0
       - name: Scan full git history for secrets (pinned Gitleaks image)
         run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --verbose --redact

   sast:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
         with:
           python-version: "3.12"
       - run: pip install --require-hashes -r requirements-dev.txt
       - run: bandit -r . -ll

   sca:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
         with:
           python-version: "3.12"
       - run: pip install --require-hashes -r requirements-dev.txt
       - run: pip-audit -r requirements.txt -r requirements-dev.txt --require-hashes --disable-pip

   semgrep:
     runs-on: ubuntu-latest
     container:
       image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - run: semgrep scan --config p/python --error --metrics=off

   image-scan:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - name: Build the image
         run: docker build -t medipay:ci .
       - name: Save the image to a file
         run: docker save medipay:ci -o image.tar
       - name: Scan the image for vulnerabilities
         run: docker run --rm -v "$PWD:/work" aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image --input /work/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
       - name: Check Dockerfile, Kubernetes and Terraform for misconfigurations (policy test fixtures are bad on purpose, so skipped)
         run: docker run --rm -v "$PWD:/work" aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /work/policies /work

   sbom:
     # SBOM = the "ingredients list" of the image. Made on every PR so a
     # reviewer can see exactly which packages would ship.
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - name: Build the image
         run: docker build -t medipay:ci .
       - name: Save the image to a file
         run: docker save medipay:ci -o image.tar
       - name: Generate SBOMs with Syft (CycloneDX and SPDX)
         run: |
           docker run --rm -v "$PWD:/work" anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
             docker-archive:/work/image.tar \
             -o cyclonedx-json=/work/sbom.cdx.json \
             -o spdx-json=/work/sbom.spdx.json
       - name: Check the SBOM lists the app's key packages
         run: |
           for pkg in fastapi uvicorn pydantic; do
             jq -e --arg p "$pkg" 'any(.components[]; .name == $p)' sbom.cdx.json > /dev/null || { echo "SBOM is missing $pkg"; exit 1; }
           done
           echo "SBOM contains $(jq '.components | length' sbom.cdx.json) components"
       - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
         with:
           name: sbom
           path: sbom.*.json
           retention-days: 90

   publish:
     # Only on main, only after every gate passed: push the image to GHCR,
     # sign it with Cosign (keyless, using GitHub's OIDC identity), attach the
     # SBOM as a signed attestation, then verify both.
     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
     needs: [lint, secrets, sast, sca, semgrep, image-scan, sbom]
     runs-on: ubuntu-latest
     permissions:
       contents: read
       packages: write   # push to ghcr.io
       id-token: write   # get a short-lived OIDC token for keyless signing
     env:
       IMAGE: ghcr.io/aarushi14622/medipay
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
         with:
           cosign-release: v3.1.4
       - name: Log in to GHCR with the job's short-lived token
         run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
       - name: Build and push the image
         run: |
           docker build -t "$IMAGE:${GITHUB_SHA}" .
           docker push "$IMAGE:${GITHUB_SHA}"
           DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}")
           echo "REF=$DIGEST" >> "$GITHUB_ENV"
           echo "Pushed $DIGEST"
       - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
         with:
           name: sbom
       - name: Sign the image (by digest, never by tag)
         run: cosign sign --yes "$REF"
       - name: Attach the SBOM as a signed attestation
         run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
       - name: Verify the signature and the attestation
         run: |
           ID="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
           cosign verify "$REF" --certificate-identity "$ID" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
           cosign verify-attestation "$REF" --type cyclonedx --certificate-identity "$ID" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
           echo "Signature and SBOM attestation verified for $REF"

   k8s-policy:
     # Policy as Code (Day 3): Kyverno policies must pass the good manifest
     # and fail the broken-on-purpose ones; the real manifests must pass.
     runs-on: ubuntu-latest
     env:
       KYVERNO_VERSION: v1.19.2
       KYVERNO_SHA256: 357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - name: Install the Kyverno CLI (pinned version, checksum verified)
         run: |
           curl -sSL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
           echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum --check
           tar xzf kyverno.tgz kyverno
       - name: Policy unit tests (good passes, bad fails)
         run: ./kyverno test policies/kyverno/tests
       - name: Real manifests comply with the policies
         run: ./kyverno apply policies/kyverno/disallow-root.yaml policies/kyverno/require-pinned-trusted-images.yaml --resource k8s/deployment.yaml

   iac:
     # Infrastructure as Code scanning (Day 4): Terraform must be valid,
     # pass Checkov (general best practice) and Conftest (MediPay's own rules).
     runs-on: ubuntu-latest
     env:
       TF_IMAGE: hashicorp/terraform:1.17.0@sha256:4d1b496a256f2989bccdb04b9104a4ede97234b10fba90259e173e905ec4fb58
       CHECKOV_IMAGE: bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
       CONFTEST_VERSION: 0.71.1
       CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - name: Terraform format check
         run: docker run --rm -v "$PWD:/w" -w /w "$TF_IMAGE" fmt -check -recursive -diff terraform
       - name: Terraform validate (no backend, no credentials)
         run: |
           for dir in terraform/*/; do
             echo "== $dir"
             docker run --rm -v "$PWD:/w" -w "/w/$dir" "$TF_IMAGE" init -backend=false -input=false > /dev/null
             docker run --rm -v "$PWD:/w" -w "/w/$dir" "$TF_IMAGE" validate
           done
       - name: Checkov scan
         run: docker run --rm -v "$PWD:/w" "$CHECKOV_IMAGE" -d /w/terraform --framework terraform --compact --quiet --skip-download
       - name: Install Conftest (pinned version, checksum verified)
         run: |
           curl -sSL -o conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
           echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum --check
           tar xzf conftest.tgz conftest
       - name: Conftest policy unit tests
         run: ./conftest verify --policy policies/conftest
       - name: Conftest on our Terraform
         run: ./conftest test --parser hcl2 --policy policies/conftest terraform/*/*.tf
       - name: Conftest must FAIL the broken-on-purpose example
         run: |
           if ./conftest test --parser hcl2 --policy policies/conftest policies/conftest/examples/bad-bucket.tf; then
             echo "Policy did not catch the bad example: the gate is broken"; exit 1
           fi
           echo "Bad example blocked as expected"

   dast:
     # Dynamic testing (Day 7): run the real container and attack it with
     # OWASP ZAP's API scan, driven by the app's own OpenAPI description.
     # Any WARN or FAIL blocks the merge.
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       - name: Build and start the app container
         run: |
           docker build -t medipay:ci .
           docker run -d --name app -p 8000:8000 medipay:ci
           for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
           docker logs app; exit 1
       - name: ZAP API scan
         run: |
           mkdir -p zap && chmod 777 zap
           docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
             zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab \
             zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
             -r zap-report.html -w zap-report.md -z "-config api.disablekey=true"
       - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
         if: always()
         with:
           name: zap-report
           path: zap/zap-report.*
           retention-days: 90
