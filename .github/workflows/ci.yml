name: CI

on:
    push:
       branches: [main]
    pull_request:
permissions:
   contents: read

jobs:
   lint: 
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v7
       - uses: actions/setup-python@v7
         with:
           python-version: "3.12"
       - run: pip install -r requirements-dev.txt
       - run: ruff check .
       - run: pytest

   secrets:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v7
         with:
           fetch-depth: 0
       - run: sudo apt-get update
       - run: sudo apt-get install -y gitleaks
       - run: gitleaks detect --source . --verbose --redact

   sast:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v7
       - uses: actions/setup-python@v7
         with:
           python-version: "3.12"
       - run: pip install -r requirements-dev.txt
       - run: bandit -r . -ll

   sca:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v7
       - uses: actions/setup-python@v7
         with:
           python-version: "3.12"
       - run: pip install -r requirements-dev.txt
       - run: pip-audit -r requirements.txt -r requirements-dev.txt --no-deps --disable-pip


   semgrep:
     runs-on: ubuntu-latest
     container:
       image: semgrep/semgrep:1.181.0
     steps:
       - uses: actions/checkout@v7
       - run: semgrep scan --config p/python --error --metrics=off

   image-scan:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v7
       - name: Build the image
         run: docker build -t medipay:ci .
       - name: Save the image to a file
         run: docker save medipay:ci -o image.tar
       - name: Scan the image for vulnerabilities
         run: docker run --rm -v "$PWD:/work" aquasec/trivy:0.70.0 image --input /work/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
       - name: Check the Dockerfile for misconfigurations
         run: docker run --rm -v "$PWD:/work" aquasec/trivy:0.70.0 config --severity HIGH,CRITICAL --exit-code 1 /work
