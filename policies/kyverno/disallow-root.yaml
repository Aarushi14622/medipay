# Policy as Code (PaC): Kubernetes refuses any pod that could run as root.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root
  annotations:
    policies.kyverno.io/title: Containers must not run as root
    policies.kyverno.io/description: >-
      Pods must set runAsNonRoot, must not allow privilege escalation and
      must not be privileged. Same idea as the Dockerfile's USER 10001,
      enforced again by the cluster.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Pods must set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: no-privilege-escalation
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Containers must set allowPrivilegeEscalation: false and must not be privileged."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
